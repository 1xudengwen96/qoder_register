# ============================================================
# qoder_register 配置模板
# 复制为 config/config.yaml 后按需修改
# 所有密钥一律用 env:VAR_NAME 形式，禁止明文
# ============================================================

region: sg                 # 默认出口地区；ipdeep 兜底只允许 us / sg
concurrency: 1             # 领取阶段强制串行，不要改

# ------------------------------------------------------------ 邮箱源
mail:
  # 明确指定只用哪个邮件源：outlook_file | outlook_tag | hotmail | icloud_relay
  # 留空＝按下方 strategy / strict_priority_order 自动挑；指定的源不可用会直接报错
  provider: ""
  # weighted: 按权重取；strict_priority: 按顺序优先耗尽；round_robin: 轮转
  strategy: strict_priority   # 先用清单里那 10 个真邮箱，耗尽了再往下掉
  # IMAP / 2Captcha 走的本机隧道（Clash 之类），留空＝直连
  imap_proxy: ""
  # Outlook 清单：email----密码----clientId----refreshToken（一行一个）
  # 填了就用文件收码；留空回落到数据库邮箱池
  outlook_file: "data/emails.txt"
  weights:
    outlook_tag: 50
    hotmail: 35
    icloud_relay: 15
  strict_priority_order: [outlook_file, outlook_tag, hotmail, icloud_relay]

  # 路线 A：Outlook 主号 + tag（name+q001@outlook.com）
  outlook_tag:
    main_accounts:
      - user: "main1@outlook.com"
        password: "env:OUTLOOK_MAIN1_PW"
        imap: "outlook.office365.com"
      - user: "main2@outlook.com"
        password: "env:OUTLOOK_MAIN2_PW"
        imap: "outlook.office365.com"
    tag_prefix: "q"
    max_tags_per_account: 8

  # 路线 B：Hotmail / Outlook 独立主号，CSV 列 email,password,imap_host,region
  hotmail:
    credentials_file: "data/hotmail_accounts.csv"

  # 路线 C：iCloud+「隐藏我的邮件」，全部转发到同一个聚合收件箱
  #   - 隐藏地址：一行一个 xxx@privaterelay.appleid.com（也可写裸用户名）
  #   - 聚合收件箱：QQ 邮箱 IMAP（imap.qq.com:993，密码填「授权码」不是登录密码）
  icloud_relay:
    relay_addresses_file: "data/icloud_relay.txt"
    quota_total: 500
    aggregator_imap:
      host: "imap.qq.com"           # QQ 邮箱；苹果自家邮箱用 imap.mail.me.com
      port: 993
      user: "填你的QQ邮箱@qq.com"
      password: "env:QQ_IMAP_PASS"  # QQ「设置-账户-IMAP/SMTP」里生成的授权码
      folder: "INBOX"
      imap_id: ""                   # 留空用默认 ID；部分服务端要求登录后发 ID
    # 收码匹配规则（按邮件服务商微调）
    match:
      sender_allow: ["qoder"]               # 不含点：iCloud 转发会改写成 no-reply_at_qoder_com_xxx@icloud.com才算
      subject_contains: ["qoder"]           # 主题或正文命中
      code_regex: "\\b(\\d{6})\\b"          # 验证码正则，第一个分组为准
      scan_body_for_recipient: true         # 正文里找隐藏地址（转发链常写进页脚）
      lookback: 60                          # 每次轮询只看最近 N 封
      extra_recipient_headers: []           # 追加要扫的收件人头，如 ["X-Forwarded-To"]

# ------------------------------------------------------------ 指纹浏览器
browser:
  # backend: adspower | bitbrowser | camoufox | playwright
  backend: "bitbrowser"
  # cdp_mode: 走原生 CDP（socket 直连），不 spawn node 驱动进程。
  # 比特 + cdp_mode 时，开窗口前会把代理自动写进环境配置。
  cdp_mode: true
  headless: false
  storage_root: "data/profiles"

  adspower:
    api_base: "http://127.0.0.1:50325"
    group_id: "0"

  bitbrowser:
    api_base: "http://127.0.0.1:54345"
    group_id: ""                 # 留空＝默认分组
    reuse_env: false            # 每轮新建窗口（指纹随机 + 代理写入后再启动）
    env_id: ""                   # 指定固定环境 id；留空按账号名自动建/找
    keep_open: false             # 跑完不关窗口（调试用）
    headless: false              # 比特客户端支持时再开

  camoufox:
    os_hint: "windows"

# ------------------------------------------------------------ 注册
register:
  signup_url: "https://qoder.com/signup"
  cdp_signup_url: "https://qoder.com/users/sign-up"   # CDP 通道用的真实注册页
  recaptcha_site_key: ""      # 从注册页 DOM 抓，抓到填这里
  hcaptcha_site_key: ""
  turnstile_site_key: ""

verify:
  timeout: 600
  confirm_hosts: ["qoder.com", "qoder.sh"]

# ------------------------------------------------------------ 打码平台
captcha:
  timeout: 180
  max_attempts: 6            # 滑块最多重试次数（CDP 通道）
  providers:
    local:
      enabled: true            # 图片验证码走本地 ddddocr，零成本
    yescaptcha:
      api_key: "env:YESCAPTCHA_KEY"
    "2captcha":
      api_key: "env:TWOCAPTCHA_KEY"
    capsolver:
      api_key: "env:CAPSOLVER_KEY"
  # 按任务类型排优先级：从左到右依次尝试，前一个失败自动降级
  prefer:
    image: [local, yescaptcha, "2captcha"]
    recaptcha_v2: [capsolver, yescaptcha, "2captcha"]
    recaptcha_v3: [capsolver, yescaptcha, "2captcha"]
    hcaptcha: [capsolver, yescaptcha, "2captcha"]
    turnstile: [capsolver, yescaptcha]

# ------------------------------------------------------------ 设备重置
device:
  app_dir: ""                  # 留空自动探测 %APPDATA%\Qoder
  backup_dir: "data/device_backup"
  fake_hardware: false         # 生成假硬件 JSON；服务端做一致性校验时反而是破绽
  # 身份模式：缺省/空 = 原随机方案（每轮全新随机身份）
  # browser = 领取段设备身份匹配注册段比特浏览器画像
  #   （同 seed 重建 FingerprintProfile 派生：平台/时区/语言/CPU/内存/GPU/分辨率
  #     与注册环境一致，且同一账号跨重置不漂移）
  identity_mode: ""
  # 可裁剪步骤：kill,machine_id,telemetry,cache,identity,advanced,login,hardware,chat
  steps: [kill, machine_id, telemetry, cache, identity, advanced, login, hardware, chat]

# ------------------------------------------------------------ 领取
claim:
  client_path: ""              # 留空＝自动探测（注册表协议 → 已知布局 → 浅扫）
  data_dir: ""                 # 留空自动探测
  wait_credit_timeout: 120
  capture_token: true
  credit_probe_url: ""         # 抓包拿到的额度接口，填了才能精确核对积分
  # 领取登录模式：inherit（默认，继承已有登录态）/ cdp（半自动）。
  # 设备重置会清空登录态，inherit 在全自动链路上等不到新 token；cdp 时人
  # 点一次客户端「登录」，拿链接后 wait_link → drive_login → 回跳全自动
  # （与 cli claim:run --login 同一套逻辑）。
  login_mode: inherit
  link_timeout: 180             # 等登录链接（剪贴板/浏览器历史）的秒数
  login_timeout: 300            # 浏览器登录状态机的总超时

# ------------------------------------------------------------ 代理
# 支持格式（一行一条）：
#   host:port:user:pass           ← 代理商导出的四段冒号（本项目默认用这个）
#   host:port:user:pass#us        ← 带地区标签，用于对齐时区/语言
#   http://user:pass@host:port#us
#   socks5://user:pass@host:port
proxy:
  source: file
  file: "data/proxies.txt"
  default_scheme: "http"       # 四段格式默认当 http 代理
  strict_region: false
  # ---- 一条一用：开一个浏览器取一条，用完作废，下一轮换新的
  one_shot: true
  state_file: "data/.proxy_state.json"   # 谁用过哪条（落盘，重启不丢）
  check_before_use: true                  # 取之前先真连一次，死的直接消耗掉
  check_timeout: 12
  # ---- 池子空了自动按模板续新会话（ipdeep 每次开窗口换一个 IP）
  auto_extend: true
  extend:
    template: "gate.ipdeep.com:8080:{user}-session-{session}-sessiontime-{ttl}:{password}"
    user: "d58983490-res-country-{region}"
    password: "env:IPDEEP_PASS"
    ttl: 5
    count: 20
    verify: true

# ------------------------------------------------------------ 地区画像
region_profiles:
  hk: { timezone: "Asia/Hong_Kong", locale: "zh-HK" }
  us: { timezone: "America/New_York", locale: "en-US" }
  uk: { timezone: "Europe/London", locale: "en-GB" }
  jp: { timezone: "Asia/Tokyo", locale: "ja-JP" }
  sg: { timezone: "Asia/Singapore", locale: "en-SG" }
  de: { timezone: "Europe/Berlin", locale: "de-DE" }
  hk: { timezone: "Asia/Hong_Kong", locale: "zh-HK" }

# ------------------------------------------------------------ 存储
storage:
  url: "sqlite:///data/qoder.db"
  artifacts_dir: "data/artifacts"
  output_dir: "data/output"      # 账号/token/统计 txt 输出目录
